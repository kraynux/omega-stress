[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omega-stress"
version = "0.1.0"
description = "Outil TUI + CLI de test de charge HTTP encadre, deuxieme outil de la suite omega-"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "kraynux", email = "kraynux@proton.me" }]
requires-python = ">=3.10"
dependencies = [
    "omega-lib>=0.1.0",
    "textual>=0.60",
    "httpx>=0.27",
    "jinja2>=3.1",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "types-psutil>=6.0",
]

[project.scripts]
omega-stress = "omega_stress.__main__:main"

# Point de packaging explicite (voir plan produit et ARCHITECTURE.md §2) :
# le gabarit Jinja2 et les feuilles de style .tcss ne sont pas des
# fichiers .py — sans ce point d'entree, ils seraient absents d'une
# installation par wheel alors que les tests locaux (executes depuis le
# depot) continuent de passer.
# `packages = ["src/omega_stress"]` seul suffit deja a TOUT embarquer
# (verifie par une construction reelle du wheel, 2026-08-25) : un bloc
# `force-include` redondant pour templates/ et styles/ existait ici avant
# cette date et cassait purement et simplement la construction du wheel
# ("A second file is being added... report.html.jinja", jamais detecte
# plus tot faute d'avoir jamais construit un wheel reel pendant cette
# session) — retire plutot que corrige, `packages` couvrait deja tout.
[tool.hatch.build.targets.wheel]
packages = ["src/omega_stress"]

[tool.pytest.ini_options]
# Restreint la decouverte pytest a tests/ : garde-fou qui rend la convention
# de nommage "load"/"ramp" (ARCHITECTURE.md §6) verifiable automatiquement.
testpaths = ["tests"]
asyncio_mode = "auto"
# Le vocabulaire produit utilise "Test" comme racine legitime (TestFamily,
# etc. - voir core/enums.py) : desactive la collecte de classes de test
# style unittest (non utilisee ici, seules des fonctions sont utilisees)
# pour eviter toute collision future avec ce vocabulaire.
python_classes = []

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

# Controle d'imports entre couches (ARCHITECTURE.md §3 et §11) : fait echouer
# la CI si la Dependency Rule est violee ou si un import a technologie unique
# (textual/sqlite3/httpx/jinja2) fuit hors de son point
# d'entree designe.
[tool.importlinter]
root_package = "omega_stress"
include_external_packages = true
# Les imports places sous `if TYPE_CHECKING:` (voir interfaces/cli/*.py)
# ne comptent pas dans le graphe de dependances analyse : c'est le
# mecanisme retenu pour typer un parametre avec DependencyContainer sans
# creer de dependance reelle (a l'execution) de interfaces/ vers app/.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
# Ordre du plus exterieur (haut, autorise a importer tout ce qui suit) au
# plus interieur (bas, n'importe rien de la liste) :
#   app                                     -- racine de composition
#   infrastructure | interfaces | plugins   -- adaptateurs, independants entre eux
#   application                             -- cas d'usage
#   ports                                   -- contrats
#   domain                                  -- metier pur
#   core                                    -- vocabulaire transverse
# infrastructure/ et interfaces/ importent toutes deux application/ (ex.
# infrastructure/runner/httpx_load_generator.py -> application.exceptions
# ::RunnerFailureError) : c'est le sens correct de la regle (l'exterieur
# depend de l'interieur), pas une violation — application/ reste
# interdite d'importer infrastructure/interfaces/plugins en retour (voir
# les contrats "forbidden" ci-dessous et la separation infrastructure/
# interfaces via le contrat d'independance dedie).
name = "Dependency Rule : les couches externes dependent des internes, jamais l'inverse"
type = "layers"
layers = [
    "omega_stress.app",
    "omega_stress.infrastructure | omega_stress.interfaces | omega_stress.plugins",
    "omega_stress.application",
    "omega_stress.ports",
    "omega_stress.domain",
    "omega_stress.core",
]

[[tool.importlinter.contracts]]
# app/ est la racine de composition (cablage des adaptateurs concrets
# derriere les ports) : elle DOIT pouvoir importer infrastructure/, ce que
# le contrat "layers" ci-dessus autorise deliberement (les deux sont a la
# meme distance du sommet). interfaces/ (TUI+CLI), elle, ne doit jamais
# court-circuiter application/ports/ pour aller chercher un adaptateur
# d'infrastructure directement — regle plus stricte que "layers" ne peut
# exprimer a elle seule, d'ou ce contrat dedie.
name = "interfaces ne dependent jamais directement de infrastructure"
type = "independence"
modules = [
    "omega_stress.interfaces",
    "omega_stress.infrastructure",
]

[[tool.importlinter.contracts]]
name = "textual seulement dans interfaces.tui"
type = "forbidden"
source_modules = [
    "omega_stress.core",
    "omega_stress.domain",
    "omega_stress.application",
    "omega_stress.ports",
    "omega_stress.infrastructure",
    "omega_stress.plugins",
    "omega_stress.shared",
    "omega_stress.app",
    "omega_stress.interfaces.cli",
]
forbidden_modules = ["textual"]

[[tool.importlinter.contracts]]
# app/ est volontairement absente de source_modules ici : c'est la racine
# de composition, elle doit pouvoir construire un SqliteProfileRepository
# etc. (voir app/dependency_container.py) — la regle "sqlite3 seulement
# dans infrastructure.storage.sqlite" reste verifiee au niveau du MODULE
# qui importe sqlite3 lui-meme, pas de tout module qui construit une
# instance d'une classe qui l'importe.
name = "sqlite3 seulement dans infrastructure.storage.sqlite"
type = "forbidden"
source_modules = [
    "omega_stress.core",
    "omega_stress.domain",
    "omega_stress.application",
    "omega_stress.ports",
    "omega_stress.interfaces",
    "omega_stress.plugins",
    "omega_stress.shared",
]
forbidden_modules = ["sqlite3"]

[[tool.importlinter.contracts]]
name = "httpx seulement dans infrastructure.runner"
type = "forbidden"
source_modules = [
    "omega_stress.core",
    "omega_stress.domain",
    "omega_stress.application",
    "omega_stress.ports",
    "omega_stress.interfaces",
    "omega_stress.plugins",
    "omega_stress.shared",
]
forbidden_modules = ["httpx"]

[[tool.importlinter.contracts]]
name = "jinja2 seulement dans infrastructure.exporters.html_exporter"
type = "forbidden"
source_modules = [
    "omega_stress.core",
    "omega_stress.domain",
    "omega_stress.application",
    "omega_stress.ports",
    "omega_stress.interfaces",
    "omega_stress.plugins",
    "omega_stress.shared",
]
forbidden_modules = ["jinja2"]

[[tool.importlinter.contracts]]
# psutil (Phase 1 observabilite, sondage systeme continu) : meme regle
# que httpx/jinja2 ci-dessus, confine a infrastructure/probe/.
name = "psutil seulement dans infrastructure.probe"
type = "forbidden"
source_modules = [
    "omega_stress.core",
    "omega_stress.domain",
    "omega_stress.application",
    "omega_stress.ports",
    "omega_stress.interfaces",
    "omega_stress.plugins",
    "omega_stress.shared",
]
forbidden_modules = ["psutil"]
